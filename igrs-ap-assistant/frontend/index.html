<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration &amp; Stamps · Government of Andhra Pradesh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --surface: #fafafa;
      --surface-subtle: #f4f4f5;
      --ink: #111111;
      --ink-secondary: #52525b;
      --ink-muted: #71717a;
      --border: #e4e4e7;
      --border-strong: #d4d4d8;
      --accent: #111111;
      --accent-hover: #27272a;
      --focus-ring: rgba(17, 17, 17, 0.12);
      --font-sans: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }


    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    input, textarea, button, select, code, pre, kbd, samp, table, th, td {
      font-family: var(--font-sans);
    }


    .num {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Markdown prose styles inside chat */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-height: 100dvh;
      background: var(--bg);
    }

    /* Top Header */
    .topbar {
      flex-shrink: 0;
      height: 56px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
    }

    .topbar-inner {
      width: 100%;
      max-width: 780px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--ink);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-text {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      color: var(--ink-muted);
      font-weight: 400;
      margin-left: 6px;
    }

    .reset-btn {
      appearance: none;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--ink-secondary);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      flex-shrink: 0;
    }

    .reset-btn:hover {
      background: var(--surface-subtle);
      border-color: var(--border-strong);
      color: var(--ink);
    }

    /* Scrollable Chat Feed */
    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 28px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .chat-column {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .empty-state {
      padding: 72px 8px 32px;
      max-width: 580px;
    }

    .empty-state h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: var(--ink);
      margin-bottom: 8px;
      line-height: 1.25;
    }

    .empty-state p {
      font-size: 15px;
      color: var(--ink-secondary);
      line-height: 1.6;
    }

    /* Messages */
    .msg-row {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .msg-row.user {
      align-items: flex-end;
    }

    .msg-row.assistant {
      align-items: flex-start;
    }

    .msg-user-bubble {
      max-width: 82%;
      background: var(--ink);
      color: #ffffff;
      padding: 11px 16px;
      border-radius: 12px 12px 3px 12px;
      font-size: 14.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-assistant-body {
      width: 100%;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.65;
      padding: 2px 0;
    }

    .msg-meta {
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--ink-muted);
    }

    /* Markdown Typography inside Assistant Messages */
    .md h1, .md h2, .md h3, .md h4 {
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--ink);
      margin-top: 16px;
      margin-bottom: 6px;
      line-height: 1.35;
    }

    .md > :first-child {
      margin-top: 0;
    }

    .md h2 { font-size: 17px; }
    .md h3 { font-size: 15.5px; }
    .md h4 { font-size: 14.5px; color: var(--ink-secondary); }

    .md p {
      margin-bottom: 10px;
    }

    .md p:last-child {
      margin-bottom: 0;
    }

    .md ul, .md ol {
      margin: 8px 0 12px 20px;
    }

    .md li {
      margin-bottom: 4px;
    }

    .md strong {
      font-weight: 600;
      color: var(--ink);
    }

    .md hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 14px 0;
    }

    .md blockquote {
      border-left: 2px solid var(--border-strong);
      padding-left: 12px;
      color: var(--ink-secondary);
      margin: 10px 0;
      font-size: 14px;
    }

    .md code {
      background: var(--surface-subtle);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--ink);
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin: 12px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
    }

    .md table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      line-height: 1.45;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    .md th {
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--ink-secondary);
      background: var(--surface);
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .md td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--ink);
      vertical-align: top;
    }

    .md tr:last-child td {
      border-bottom: none;
    }

    .md td.num-col, .md th.num-col {
      text-align: right;
      white-space: nowrap;
    }

    /* Loading indicator */
    .thinking {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink-muted);
      font-size: 13.5px;
      padding: 6px 0;
    }

    .thinking-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink-muted);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    /* Bottom Composer */
    .composer-wrap {
      flex-shrink: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 14px 20px 18px;
      display: flex;
      justify-content: center;
    }

    .composer-form {
      width: 100%;
      max-width: 780px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 8px 8px 8px 14px;
      background: var(--bg);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .composer-form:focus-within {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .composer-input {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--ink);
      font-size: 14.5px;
      line-height: 1.5;
      min-height: 24px;
      max-height: 160px;
      padding: 4px 0;
    }

    .composer-input::placeholder {
      color: var(--ink-muted);
    }

    .send-btn {
      appearance: none;
      border: none;
      background: var(--accent);
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
      flex-shrink: 0;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .send-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    @media (max-width: 640px) {
      .brand-sub { display: none; }
      .empty-state { padding-top: 36px; }
      .msg-user-bubble { max-width: 92%; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark">AP</span>
          <span class="brand-text">
            Registration &amp; Stamps
            <span class="brand-sub">· Government of Andhra Pradesh</span>
          </span>
        </div>
        <button id="resetBtn" class="reset-btn" type="button">Reset Chat</button>
      </div>
    </header>

    <main id="chatScroll" class="chat-scroll">
      <div id="chatColumn" class="chat-column">
        <section id="emptyState" class="empty-state">
          <h1>AP Registration &amp; Stamps Advisory</h1>
          <p>Ask about deed duty rates, stamp duty and registration fee calculations, partition VSS rules, DAGPA adjustments, Section 22-A restrictions, or statutory enquiry procedures.</p>
        </section>
      </div>
    </main>

    <footer class="composer-wrap">
      <form id="chatForm" class="composer-form">
        <textarea
          id="chatInput"
          class="composer-input"
          rows="1"
          placeholder="Ask any Andhra Pradesh registration, stamp duty, or statutory question..."
          autocomplete="off"
        ></textarea>
        <button id="sendBtn" class="send-btn" type="submit">Send</button>
      </form>
    </footer>
  </div>

  <script>
    const chatScroll = document.getElementById('chatScroll');
    const chatColumn = document.getElementById('chatColumn');
    const emptyState = document.getElementById('emptyState');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const resetBtn = document.getElementById('resetBtn');

    let isBusy = false;

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatInlineMarkdown(text) {
      let safe = escapeHtml(text);
      safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
      safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      safe = safe.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      safe = safe.replace(/([₹]\s*[\d,]+(?:\.\d+)?|\b\d+(?:\.\d+)?%)/g, '<span class="num">$1</span>');
      return safe;
    }

    // Append Assistant Bubble
    function isNumericCell(cell) {
      const cleaned = cell.replace(/[₹,\s%+-]/g, '');
      return cleaned.length > 0 && (/^\d+(?:\.\d+)?$/.test(cleaned) || /^Rs\.?\d/i.test(cell.trim()));
    }

    function renderMarkdown(rawText) {
      const lines = String(rawText || '').replace(/\r\n/g, '\n').split('\n');
      const out = [];
      let i = 0;

      while (i < lines.length) {
        const line = lines[i];
        const trimmed = line.trim();

        if (!trimmed) {
          i++;
          continue;
        }

        // Horizontal rule
        if (/^---+$/.test(trimmed)) {
          out.push('<hr />');
          i++;
          continue;
        }

        // Headings
        const hMatch = trimmed.match(/^(#{1,4})\s+(.+)$/);
        if (hMatch) {
          const level = hMatch[1].length;
          out.push(`<h${level}>${formatInlineMarkdown(hMatch[2])}</h${level}>`);
          i++;
          continue;
        }

        // GFM Table
        if (trimmed.includes('|') && i + 1 < lines.length && /^\s*\|?[\s:-]+\|[\s|:-]*$/.test(lines[i + 1])) {
          const parseRow = (rowStr) => {
            let s = rowStr.trim();
            if (s.startsWith('|')) s = s.slice(1);
            if (s.endsWith('|')) s = s.slice(0, -1);
            return s.split('|').map(c => c.trim());
          };
          const headers = parseRow(trimmed);
          i += 2;
          const bodyRows = [];
          while (i < lines.length && lines[i].trim().includes('|')) {
            bodyRows.push(parseRow(lines[i]));
            i++;
          }
          const numericCols = headers.map((_, colIdx) =>
            bodyRows.some(r => r[colIdx] && isNumericCell(r[colIdx]))
          );
          let html = '<div class="table-wrap"><table><thead><tr>';
          headers.forEach((h, idx) => {
            html += `<th class="${numericCols[idx] ? 'num-col' : ''}">${formatInlineMarkdown(h)}</th>`;
          });
          html += '</tr></thead><tbody>';
          bodyRows.forEach(row => {
            html += '<tr>';
            headers.forEach((_, idx) => {
              const cell = row[idx] || '';
              html += `<td class="${numericCols[idx] ? 'num-col num' : ''}">${formatInlineMarkdown(cell)}</td>`;
            });
            html += '</tr>';
          });
          html += '</tbody></table></div>';
          out.push(html);
          continue;
        }

        // Blockquote
        if (trimmed.startsWith('>')) {
          const quoteLines = [];
          while (i < lines.length && lines[i].trim().startsWith('>')) {
            quoteLines.push(lines[i].trim().replace(/^>\s?/, ''));
            i++;
          }
          out.push(`<blockquote>${quoteLines.map(formatInlineMarkdown).join('<br />')}</blockquote>`);
          continue;
        }

        // Unordered list
        if (/^[-*•]\s+/.test(trimmed)) {
          const items = [];
          while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) {
            items.push(lines[i].trim().replace(/^[-*•]\s+/, ''));
            i++;
          }
          out.push(`<ul>${items.map(item => `<li>${formatInlineMarkdown(item)}</li>`).join('')}</ul>`);
          continue;
        }

        // Ordered list
        if (/^\d+\.\s+/.test(trimmed)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(lines[i].trim().replace(/^\d+\.\s+/, ''));
            i++;
          }
          out.push(`<ol>${items.map(item => `<li>${formatInlineMarkdown(item)}</li>`).join('')}</ol>`);
          continue;
        }

        // Paragraph
        const paraLines = [];
        while (
          i < lines.length &&
          lines[i].trim() &&
          !/^(#{1,4}\s+|[-*•]\s+|\d+\.\s+|>\s?|---+$)/.test(lines[i].trim()) &&
          !(lines[i].trim().includes('|') && i + 1 < lines.length && /^\s*\|?[\s:-]+\|/.test(lines[i + 1]))
        ) {
          paraLines.push(lines[i].trim());
          i++;
        }
        out.push(`<p>${paraLines.map(formatInlineMarkdown).join('<br />')}</p>`);
      }

      return out.join('');
    }

    function nowTimeLabel() {
      return new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    function appendUserMessage(text) {
      if (emptyState && emptyState.parentNode) {
        emptyState.remove();
      }
      const row = document.createElement('div');
      row.className = 'msg-row user';
      const bubble = document.createElement('div');
      bubble.className = 'msg-user-bubble num';
      bubble.textContent = text;
      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.textContent = nowTimeLabel();
      row.appendChild(bubble);
      row.appendChild(meta);
      chatColumn.appendChild(row);
      scrollToBottom();
    }

    function appendThinking() {
      const row = document.createElement('div');
      row.className = 'msg-row assistant';
      row.innerHTML = '<div class="thinking"><span class="thinking-dot"></span><span>Checking statutory rates and rules...</span></div>';
      chatColumn.appendChild(row);
      scrollToBottom();
      return row;
    }

    function appendAssistantMessage(replyText) {
      const row = document.createElement('div');
      row.className = 'msg-row assistant';
      const body = document.createElement('div');
      body.className = 'msg-assistant-body md';
      body.innerHTML = renderMarkdown(replyText);
      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.textContent = nowTimeLabel();
      row.appendChild(body);
      row.appendChild(meta);
      chatColumn.appendChild(row);
      scrollToBottom();
    }

    async function handleChatSubmit(event) {
      event.preventDefault();
      if (isBusy) return;
      const text = chatInput.value.trim();
      if (!text) return;

      chatInput.value = '';
      chatInput.style.height = 'auto';
      appendUserMessage(text);

      isBusy = true;
      sendBtn.disabled = true;
      const loader = appendThinking();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, use_gemini: true }),
        });
        const data = await res.json();
        loader.remove();
        if (!res.ok) {
          appendAssistantMessage(data.detail || 'Unable to process query.');
        } else {
          appendAssistantMessage(data.reply || 'No response returned.');
        }
      } catch (err) {
        loader.remove();
        appendAssistantMessage('Connection error while contacting the server.');
      } finally {
        isBusy = false;
        sendBtn.disabled = false;
        chatInput.focus();
      }
    }

    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 160) + 'px';
    });

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        chatForm.dispatchEvent(new Event('submit', { cancelable: true }));
      }
    });

    chatForm.addEventListener('submit', handleChatSubmit);

    resetBtn.addEventListener('click', () => {
      chatColumn.innerHTML = '';
      chatColumn.appendChild(emptyState);
      chatInput.value = '';
      chatInput.style.height = 'auto';
      chatInput.focus();
    });
  </script>
</body>

</html>
